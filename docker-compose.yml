services:
  surrealdb:
    image: "surrealdb/surrealdb:${SURREALDB_IMAGE_TAG:-v3.2.0}"
    restart: unless-stopped
    user: "0:0"
    command:
      [
        "start",
        "--log",
        "info",
        "--user",
        "${SURREAL_USER:-root}",
        "--pass",
        "${SURREAL_PASS:-root}",
        "surrealkv:///var/lib/surrealdb/lottery.db",
      ]
    ports:
      - "${SURREAL_BIND_HOST:-127.0.0.1}:${SURREAL_PORT:-18000}:8000"
    volumes:
      - surrealdb-data:/var/lib/surrealdb
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "ws://127.0.0.1:8000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_VERSION: "${BUN_VERSION:-1.3.14}"
        USE_DOKPLOY_CRON: "${USE_DOKPLOY_CRON:-0}"
        NUXT_PUBLIC_APP_MODE: "${NUXT_PUBLIC_APP_MODE:-live}"
    depends_on:
      surrealdb:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-7341}:7341"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 7341
      SURREAL_URL: ws://surrealdb:8000
      SURREAL_USER: ${SURREAL_USER:-root}
      SURREAL_PASS: ${SURREAL_PASS:-root}
      SURREAL_NS: ${SURREAL_NS:-lottery}
      SURREAL_DB: ${SURREAL_DB:-main}
      RPC_URL: ${RPC_URL}
      TOKEN_ADDRESS: ${TOKEN_ADDRESS}
      LOTTERY_ADDRESS: ${LOTTERY_ADDRESS}
      VAULT_ADDRESS: ${VAULT_ADDRESS}
      TOKEN_DEPLOYMENT_BLOCK: ${TOKEN_DEPLOYMENT_BLOCK}
      LOTTERY_DEPLOYMENT_BLOCK: ${LOTTERY_DEPLOYMENT_BLOCK}
      ELIGIBILITY_LOG_CHUNK_SIZE: ${ELIGIBILITY_LOG_CHUNK_SIZE:-20000}
      ELIGIBILITY_EXCLUDED_ADDRESSES: ${ELIGIBILITY_EXCLUDED_ADDRESSES:-}
      TRANSACTION_CONFIRMATIONS: "${TRANSACTION_CONFIRMATIONS:-3}"
      ELIGIBILITY_SIGNER_PRIVATE_KEY: ${ELIGIBILITY_SIGNER_PRIVATE_KEY}
      BSC_MAINNET_PRIVATE_KEY: ${BSC_MAINNET_PRIVATE_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      USE_DOKPLOY_CRON: "${USE_DOKPLOY_CRON:-0}"
      ENABLE_AUTO_VRF_RETRY: "${ENABLE_AUTO_VRF_RETRY:-0}"
      VRF_TOP_UP_AMOUNT_BNB: "${VRF_TOP_UP_AMOUNT_BNB:-0.005}"
      NUXT_PUBLIC_CHAIN_ID: "${NUXT_PUBLIC_CHAIN_ID:-56}"
      NUXT_PUBLIC_CHAIN_NAME: "${NUXT_PUBLIC_CHAIN_NAME:-BSC Mainnet}"
      NUXT_PUBLIC_CHAIN_CURRENCY_SYMBOL: "${NUXT_PUBLIC_CHAIN_CURRENCY_SYMBOL:-BNB}"
      NUXT_PUBLIC_CHAIN_RPC_URL: ${NUXT_PUBLIC_CHAIN_RPC_URL:-}
      NUXT_PUBLIC_CHAIN_BLOCK_EXPLORER_URL: "${NUXT_PUBLIC_CHAIN_BLOCK_EXPLORER_URL:-https://bscscan.com}"
      NUXT_PUBLIC_TOKEN_ADDRESS: ${NUXT_PUBLIC_TOKEN_ADDRESS:-}
      NUXT_PUBLIC_LOTTERY_ADDRESS: ${NUXT_PUBLIC_LOTTERY_ADDRESS:-}
      NUXT_PUBLIC_ENVIRONMENT: "${NUXT_PUBLIC_ENVIRONMENT:-production}"
      NUXT_PUBLIC_APP_MODE: "${NUXT_PUBLIC_APP_MODE:-live}"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:7341/api/health'); if (!response.ok) process.exit(1); const body = await response.json(); if (body.status !== 'ok') process.exit(1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  surrealdb-data:
