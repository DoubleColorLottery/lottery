[profile.default]
src = "src"
out = "out"
libs = ["../../node_modules", "lib"]
test = "test/foundry"
remappings = [
    "@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/",
    "@openzeppelin/token/=../../node_modules/@openzeppelin/contracts/token/",
    "@openzeppelin/=../../node_modules/@openzeppelin/contracts/",
    "@openzeppelin-contracts-upgradeable/=../../node_modules/@openzeppelin/contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/",
]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
verbosity = 3
# Exclude fork tests from default run (require archive node)
no_match_contract = ".*ForkTest"

# Fork configuration for testing
[rpc_endpoints]
bsc_mainnet = "https://bsc-dataseed.binance.org"
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"

# Etherscan API V2 - Unified endpoint for all chains
# Etherscan's unified API uses one endpoint with a chain ID parameter.
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 1 }
bsc = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 56 }
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 97 }
base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 8453 }
arbitrum = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 42161 }
polygon = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 137 }
optimism = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api", chain = 10 }

# CI profile for faster tests
[profile.ci]
verbosity = 2
fuzz = { runs = 256 }

[lint]
lint_on_build = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
